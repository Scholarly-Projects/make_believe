<script>
/* ============================================================================
   InterVis — Interstitial Visualization Handler
   Manages a single inter_vis section.

   Opacity  : threshold-based (CSS 1s transition handles the visual fade).
   Transform: segment-lerp, driven frame-by-frame by JS with NO CSS transition.
              Adding a CSS transition on transform would fight the scroll-position
              lerp and produce a rubber-band effect.

   Instantiated by ScrollyTelling.setupInterVisBlock().
   ============================================================================ */

class InterVis {

  /**
   * @param {HTMLElement} triggerBlock    .intervis-trigger-block
   * @param {HTMLElement} layerContainer  .intervis-layer-container
   * @param {HTMLElement} frame           .intervis-frame  (is-active toggled here)
   * @param {HTMLElement} stickyTitle     .intervis-sticky-title  (CSS via frame.is-active)
   * @param {HTMLElement} hintEl          .intervis-scroll-hint   (optional)
   */
  constructor(triggerBlock, layerContainer, frame, stickyTitle, hintEl) {
    this.triggerBlock   = triggerBlock;
    this.layerContainer = layerContainer;
    this.frame          = frame;
    this.stickyTitle    = stickyTitle;
    this.hintEl         = hintEl || null;

    this.triggers     = [];   // all parsed trigger descriptors, DOM order
    this.segments     = [];   // {id, from, to} consecutive pairs per layer
    this.layerEls     = new Map();   // id → <img>
    this._lastOpacity = new Map();   // id → opacity (for diffing)

    this._basePath = window.intervisBasePath || '/objects/inter_vis/';

    this._parse();
    this._buildSegments();
    this._sizeTriggerBlock();
    this._setupVisibilityObserver();
  }

  // ─────────────────────────────────────────────────────────────────
  // PARSE trigger markers
  // ─────────────────────────────────────────────────────────────────
  _parse() {
    this.triggerBlock
      .querySelectorAll('[data-trigger-type]')
      .forEach(marker => {
        const id      = marker.dataset.triggerId     || '';
        const action  = marker.dataset.triggerAction || 'start';

        // opacity: attribute is 0–100 integer; normalise to 0–1 for CSS
        const rawOp = marker.dataset.triggerOpacity;
        const opacity = (rawOp !== undefined && rawOp !== '')
          ? Math.min(1, Math.max(0, parseFloat(rawOp) / 100))
          : 1;

        // zoom: scale factor ÷10 in JS; default 10 = 1×
        const rawZoom = marker.dataset.triggerZoom;
        const zoom    = (rawZoom !== undefined && rawZoom !== '')
          ? parseFloat(rawZoom)
          : 10;

        const coords = marker.dataset.triggerCoordinates || null;

        this.triggers.push({ marker, id, action, opacity, zoom, coords });
      });
  }

  // ─────────────────────────────────────────────────────────────────
  // BUILD SEGMENTS — consecutive trigger pairs for each layer id.
  //
  // A segment connects two triggers for the same id in DOM order:
  //   start → start   (layer moves / changes zoom)
  //   start → end     (layer exits; interpolate before fade-out)
  //
  // During the reader's scroll between a segment's from–to positions,
  // zoom and coordinates are lerped linearly.
  // ─────────────────────────────────────────────────────────────────
  _buildSegments() {
    const byId = new Map(); // id → [trigger, ...]
    this.triggers.forEach(t => {
      if (t.id === 'all') return;
      if (!byId.has(t.id)) byId.set(t.id, []);
      byId.get(t.id).push(t);
    });

    byId.forEach((list, id) => {
      for (let i = 0; i < list.length - 1; i++) {
        this.segments.push({ id, from: list[i], to: list[i + 1] });
      }
    });
  }

  // ─────────────────────────────────────────────────────────────────
  // SIZE trigger block via setProperty('important').
  //
  // padding-top: 15vh  → first trigger's midpoint passes viewportCenter
  //                       after only ~5vh of scrolling (first push).
  // padding-bottom: 50vh → clean exit breathing room.
  //
  // setProperty with 'important' flag beats the high-specificity padding
  // set by .scrolly-text-content without needing !important in CSS.
  // ─────────────────────────────────────────────────────────────────
  _sizeTriggerBlock() {
    if (!this.triggers.length) return;
    this.triggerBlock.style.setProperty('padding-top',    '15vh', 'important');
    this.triggerBlock.style.setProperty('padding-bottom', '50vh', 'important');
  }

  // ─────────────────────────────────────────────────────────────────
  // VISIBILITY OBSERVER — activate frame when trigger block is in view
  // ─────────────────────────────────────────────────────────────────
  _setupVisibilityObserver() {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const active = entry.isIntersecting;
        this.frame?.classList.toggle('is-active', active);
        // CSS .intervis-frame.is-active handles frame-inner, sticky-title, hint
        if (!active) this._clearAllLayers();
      });
    }, { threshold: 0 });

    obs.observe(this.triggerBlock);
    this._visibilityObserver = obs;
  }

  // ─────────────────────────────────────────────────────────────────
  // HANDLE SCROLL  (called by ScrollyTelling on every scroll event)
  //
  // Phase 1 — Opacity: stateless replay, threshold-based, CSS fades
  // Phase 2 — Transform: segment lerp, pure JS, no CSS transition
  // Phase 3 — Hint: hide once any trigger has fired
  // ─────────────────────────────────────────────────────────────────
  handleScroll(viewportCenter) {

    // ── Phase 1: Opacity ───────────────────────────────────────────
    const desired = new Map(); // id → opacity

    for (const t of this.triggers) {
      const rect   = t.marker.getBoundingClientRect();
      const passed = rect.top + rect.height / 2 < viewportCenter;
      if (!passed) continue;

      if (t.action === 'start' && t.id !== 'all') {
        desired.set(t.id, t.opacity);
      } else if (t.action === 'end') {
        if (t.id === 'all') {
          desired.clear();                 // fade all layers simultaneously
        } else {
          desired.delete(t.id);            // fade individual layer
        }
      }
    }

    // Apply changes — only touch layers whose opacity actually changed
    desired.forEach((targetOpacity, id) => {
      if (this._lastOpacity.get(id) === targetOpacity) return;
      const img = this._getOrCreateLayer(id);
      if (img) img.style.opacity = String(targetOpacity);
    });

    this._lastOpacity.forEach((_, id) => {
      if (!desired.has(id)) {
        const img = this.layerEls.get(id);
        if (img && parseFloat(img.style.opacity) !== 0) img.style.opacity = '0';
      }
    });

    this._lastOpacity = new Map(desired);

    // ── Phase 2: Transform lerp ────────────────────────────────────
    this._updateTransforms(viewportCenter);

    // ── Phase 3: Scroll hint ───────────────────────────────────────
    if (desired.size > 0 && this.hintEl) {
      this.hintEl.classList.remove('is-active');
    }
  }

  // ─────────────────────────────────────────────────────────────────
  // TRANSFORM LERP
  //
  // For each segment, determine where the reader is relative to the
  // from–to trigger pair and lerp zoom + coords. This drives smooth
  // continuous movement (e.g., a node traversing a map) and gradual
  // zoom across scroll distance.
  //
  // Layers with no segments keep the initial transform set at creation.
  // ─────────────────────────────────────────────────────────────────
  _updateTransforms(viewportCenter) {
    this.segments.forEach(seg => {
      const img = this.layerEls.get(seg.id);
      if (!img || parseFloat(img.style.opacity) === 0) return;

      const fromRect = seg.from.marker.getBoundingClientRect();
      const toRect   = seg.to.marker.getBoundingClientRect();
      const fromY    = fromRect.top + fromRect.height / 2;
      const toY      = toRect.top   + toRect.height / 2;

      if (fromY < viewportCenter && toY > viewportCenter) {
        // Reader is within this segment — lerp
        const t    = Math.max(0, Math.min(1, (viewportCenter - fromY) / (toY - fromY)));
        const zoom = this._lerp(seg.from.zoom, seg.to.zoom, t);
        const x    = this._lerp(this._cx(seg.from.coords), this._cx(seg.to.coords), t);
        const y    = this._lerp(this._cy(seg.from.coords), this._cy(seg.to.coords), t);
        this._setTransform(img, zoom, x, y);

      } else if (toY <= viewportCenter) {
        // Past this segment — hold at "to" state
        this._setTransform(img, seg.to.zoom, this._cx(seg.to.coords), this._cy(seg.to.coords));

      } else {
        // Before this segment — hold at "from" state
        this._setTransform(img, seg.from.zoom, this._cx(seg.from.coords), this._cy(seg.from.coords));
      }
    });
  }

  // ─────────────────────────────────────────────────────────────────
  // _setTransform — direct DOM write, NO CSS transition on transform.
  // transform is continuously overwritten by _updateTransforms on every
  // scroll event; a CSS transition would lag behind the scroll position.
  // ─────────────────────────────────────────────────────────────────
  _setTransform(img, zoom, x, y) {
    img.style.transformOrigin = `${x}% ${y}%`;
    img.style.transform       = `scale(${(zoom || 10) / 10})`;
  }

  // ─────────────────────────────────────────────────────────────────
  // Coordinate helpers — convert "x,y" in 0–1000 space to 0–100%
  // ─────────────────────────────────────────────────────────────────
  _cx(coords) {
    if (!coords) return 50;
    const v = parseFloat(coords.split(',')[0]);
    return isNaN(v) ? 50 : (v / 1000) * 100;
  }

  _cy(coords) {
    if (!coords) return 50;
    const parts = coords.split(',');
    if (parts.length < 2) return 50;
    const v = parseFloat(parts[1]);
    return isNaN(v) ? 50 : (v / 1000) * 100;
  }

  _lerp(a, b, t) { return a + (b - a) * t; }

  // ─────────────────────────────────────────────────────────────────
  // GET OR CREATE a layer <img>
  // Applies initial transform from the first trigger for this id.
  // ─────────────────────────────────────────────────────────────────
  _getOrCreateLayer(id) {
    if (this.layerEls.has(id)) return this.layerEls.get(id);

    const img         = document.createElement('img');
    img.className     = 'intervis-layer';
    img.alt           = '';
    img.style.opacity = '0';
    img.src           = this._basePath + id + '.png';

    // Initial transform from the first trigger mentioning this id
    const first = this.triggers.find(t => t.id === id);
    if (first) this._setTransform(img, first.zoom, this._cx(first.coords), this._cy(first.coords));

    img.addEventListener('error', () => {
      console.warn(`InterVis: could not load "${id}" from ${img.src}`);
    }, { once: true });

    this.layerContainer.appendChild(img);
    this.layerEls.set(id, img);
    return img;
  }

  // ─────────────────────────────────────────────────────────────────
  _clearAllLayers() {
    this.layerEls.forEach(img => { img.style.opacity = '0'; });
    this._lastOpacity.clear();
  }

  destroy() {
    this._visibilityObserver?.disconnect();
    this._clearAllLayers();
    this.layerEls.forEach(img => img.remove());
    this.layerEls.clear();
  }
}
</script>
