<script>
/* ============================================================================
   InterVis — Interstitial Visualization Handler
   ============================================================================ */

class InterVis {

  constructor(triggerBlock, layerContainer, frame, stickyTitle) {
    this.triggerBlock    = triggerBlock;
    this.layerContainer  = layerContainer;
    this.frame           = frame;
    this.stickyTitle     = stickyTitle;

    this.triggers  = [];
    this.layerEls  = new Map();
    this._lastState = new Map();

    this._basePath = window.intervisBasePath || '/objects/inter_vis/';

    this._parse();
    this._sizeTriggerBlock();
    this._setupVisibilityObserver();
  }

  // ─────────────────────────────────────────────────────────────────
  // PARSE triggers from marker elements
  // ─────────────────────────────────────────────────────────────────
  _parse() {
    this.triggerBlock
      .querySelectorAll('[data-trigger-type]')
      .forEach(marker => {
        const id     = marker.dataset.triggerId     || '';
        const action = marker.dataset.triggerAction || 'start';

        // opacity: read as integer 0–100 from data-trigger-opacity,
        // then normalise to 0–1 for CSS.
        // If the attribute is absent, default to fully opaque (1).
        const rawOpacity = marker.dataset.triggerOpacity;
        const opacity    = (rawOpacity !== undefined && rawOpacity !== '')
          ? Math.min(1, Math.max(0, parseFloat(rawOpacity) / 100))
          : 1;

        const zoom   = marker.dataset.triggerZoom
          ? parseFloat(marker.dataset.triggerZoom)
          : 10;
        const coords = marker.dataset.triggerCoordinates || null;

        this.triggers.push({ marker, id, action, opacity, zoom, coords });
      });
  }

  // ─────────────────────────────────────────────────────────────────
  // SIZE trigger block
  //
  // IMPORTANT: uses setProperty(..., 'important') so the inline style
  // beats the specificity of .scrolly-text-content's padding rule even
  // though that rule is not marked !important in the CSS.
  // We cannot use element.style.paddingTop = '50vh' because the cascade
  // priority of a class rule can exceed a plain inline assignment in some
  // browser/SCSS combinator situations. Using setProperty with the
  // 'important' flag guarantees the JS value wins without requiring
  // !important in the CSS rule we're trying to override.
  // ─────────────────────────────────────────────────────────────────
  _sizeTriggerBlock() {
    if (!this.triggers.length) return;
    this.triggerBlock.style.setProperty('padding-top',    '50vh', 'important');
    this.triggerBlock.style.setProperty('padding-bottom', '50vh', 'important');
  }

  // ─────────────────────────────────────────────────────────────────
  // VISIBILITY OBSERVER — activate frame + title when section enters viewport
  // ─────────────────────────────────────────────────────────────────
  _setupVisibilityObserver() {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const active = entry.isIntersecting;
        this.frame?.classList.toggle('is-active', active);
        if (this.stickyTitle) {
          this.stickyTitle.classList.toggle('is-active', active);
        }
        if (!active) this._clearAllLayers();
      });
    }, { threshold: 0 });

    observer.observe(this.triggerBlock);
    this._visibilityObserver = observer;
  }

  // ─────────────────────────────────────────────────────────────────
  // HANDLE SCROLL — called by ScrollyTelling on every scroll event
  // ─────────────────────────────────────────────────────────────────
  handleScroll(viewportCenter) {
    // Stateless replay: derive desired state from scratch on every call.
    // Walking forward through all triggers ensures backward scrolling
    // reverses layers automatically.
    const desired = new Map(); // id → opacity (0–1)

    for (const t of this.triggers) {
      const rect   = t.marker.getBoundingClientRect();
      const passed = rect.top + rect.height / 2 < viewportCenter;
      if (!passed) continue;

      if (t.action === 'start' && t.id !== 'all') {
        desired.set(t.id, t.opacity);
      } else if (t.action === 'end') {
        if (t.id === 'all') {
          desired.clear();          // fade every visible layer simultaneously
        } else {
          desired.delete(t.id);     // fade individual layer
        }
      }
    }

    // Apply diff — only touch elements whose opacity changed
    desired.forEach((targetOpacity, id) => {
      const prev = this._lastState.get(id);
      if (prev === targetOpacity) return;
      const img = this._getOrCreateLayer(id);
      if (img) img.style.opacity = String(targetOpacity);
    });

    this._lastState.forEach((_, id) => {
      if (!desired.has(id)) {
        const img = this.layerEls.get(id);
        if (img && parseFloat(img.style.opacity) !== 0) {
          img.style.opacity = '0';
        }
      }
    });

    this._lastState = new Map(desired);
  }

  // ─────────────────────────────────────────────────────────────────
  // GET OR CREATE a layer <img> for a given id
  // ─────────────────────────────────────────────────────────────────
  _getOrCreateLayer(id) {
    if (this.layerEls.has(id)) return this.layerEls.get(id);

    const img = document.createElement('img');
    img.className     = 'intervis-layer';
    img.alt           = '';
    img.style.opacity = '0';

    // src: basePath + id + '.png'
    // window.intervisBasePath is set by the layout template.
    img.src = this._basePath + id + '.png';

    // Apply initial transform from the start trigger for this id
    const startTrigger = this.triggers.find(t => t.id === id && t.action === 'start');
    if (startTrigger) {
      this._applyTransform(img, startTrigger.zoom, startTrigger.coords);
    }

    img.addEventListener('error', () => {
      console.warn(`InterVis: could not load "${id}" from ${img.src}`);
    }, { once: true });

    this.layerContainer.appendChild(img);
    this.layerEls.set(id, img);
    return img;
  }

  // ─────────────────────────────────────────────────────────────────
  // APPLY TRANSFORM — zoom + pan
  // zoom: scale factor (÷10; 10 = 1×, 15 = 1.5×)
  // coords: "x,y" in 0–1000 space → transform-origin percent
  // ─────────────────────────────────────────────────────────────────
  _applyTransform(img, zoom, coords) {
    let x = 50, y = 50;
    if (coords) {
      const parts = coords.split(',').map(Number);
      if (parts.length >= 2) {
        x = (parts[0] / 1000) * 100;
        y = (parts[1] / 1000) * 100;
      }
    }
    img.style.transformOrigin = `${x}% ${y}%`;
    img.style.transform       = `scale(${(zoom || 10) / 10})`;
    img.style.transition      = 'opacity 1s ease';
  }

  // ─────────────────────────────────────────────────────────────────
  _clearAllLayers() {
    this.layerEls.forEach(img => { img.style.opacity = '0'; });
    this._lastState.clear();
  }

  destroy() {
    this._visibilityObserver?.disconnect();
    this._clearAllLayers();
    this.layerEls.forEach(img => img.remove());
    this.layerEls.clear();
  }
}
</script>
